[package]
name = "somnia-tui"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Somnia CLI terminal UI: run + watch + approve"

[lib]
name = "somnia_tui"
path = "src/lib.rs"

[[bin]]
name = "somnia-tui"
path = "src/main.rs"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[workspace]
