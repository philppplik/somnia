[package]
name = "somnia-extension-assets"
version = "0.1.0"
edition = "2021"
[dependencies]
image = { version = "=0.25.9", default-features = false, features = ["png", "jpeg"] }
png = "=0.18.0"
resvg = { version = "=0.45.1", default-features = false }
roxmltree = "=0.20.0"
svgtypes = "=0.15.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
crc32fast = "1"
