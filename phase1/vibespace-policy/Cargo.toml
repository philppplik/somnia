[package]
name = "vibespace-policy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Vibe Space consent broker, request-bound approval tokens and scoped file executor"

# Standalone crate: not part of any other Cargo workspace.
[workspace]

[lib]
name = "vibespace_policy"

[features]
# Use the cap-std layer (the Windows implementation) on Unix too. Test-only: lets the Windows
# code path run on Linux CI. Unix builds use the openat layer by default.
cap-layer = ["dep:cap-std", "dep:cap-fs-ext"]

[dependencies]
cap-std = { version = "3.4.6", optional = true }
cap-fs-ext = { version = "3.4.6", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_System_Threading",
] }

[target.'cfg(not(unix))'.dependencies]
cap-std = "3.4.6"
cap-fs-ext = "3.4.6"

[dev-dependencies]
tempfile = "3"
rcgen = "0.13"
