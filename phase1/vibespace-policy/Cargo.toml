[package]
name = "vibespace-policy"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Vibe Space consent broker, request-bound approval tokens and scoped file executor"

# Standalone crate: not part of any other Cargo workspace.
[workspace]

[lib]
name = "vibespace_policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
