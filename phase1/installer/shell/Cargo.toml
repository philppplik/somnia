[package]
name = "somnia-setup"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Somnia custom Windows installer (WebView2 shell around the embedded NSIS payload)"
build = "build.rs"

[[bin]]
name = "Somnia-Setup"
path = "src/main.rs"

[dependencies]
somnia-installer-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
wry = "0.47"
tao = "0.30"
winreg = "0.52"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Globalization", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Threading"] }
rfd = { version = "0.15", default-features = false }

[build-dependencies]
sha2 = "0.10"
