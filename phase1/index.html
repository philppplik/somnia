<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="color-scheme" content="dark light"/><link rel="icon" type="image/png" href="/favicon.png"/><title>Somnia | Desktop foundation</title></head><body><div id="root"></div><script>
// DIAG BUILD (12.0.0 boot trace, #windows-black-screen): catches errors BEFORE the module graph
// runs (they predate main.tsx's handlers and never reach somnia.log) and paints boot milestones
// into the window. Copy button puts the full trace on the clipboard.
(function(){var marks=[];
function paint(){var el=document.getElementById('boot-trace');if(!el){el=document.createElement('div');el.id='boot-trace';el.style.cssText='position:fixed;left:0;bottom:0;z-index:2147483647;background:#111;color:#0f0;font:12px monospace;padding:6px 8px;max-width:100vw';var pre=document.createElement('pre');pre.style.cssText='margin:0;white-space:pre-wrap;user-select:text';el.appendChild(pre);var b=document.createElement('button');b.textContent='copy trace';b.onclick=function(){try{navigator.clipboard.writeText(pre.textContent||'');}catch(_){var r=document.createRange();r.selectNodeContents(pre);var sel=getSelection();sel.removeAllRanges();sel.addRange(r);}};el.appendChild(b);(document.body||document.documentElement).appendChild(el);}el.querySelector('pre').textContent='SOMNIA BOOT TRACE\n'+marks.join('\n');}
function mark(m){marks.push(new Date().toISOString().slice(11,19)+' '+m);try{localStorage.setItem('somnia-boot-trace',marks.join('\n'));}catch(_){}paint();}
window.__bootMark=mark;
mark('inline-script: HTML parsed');
window.addEventListener('error',function(e){mark('WINDOW-ERROR: '+(e.message||'?')+' @ '+(e.filename||'?')+':'+(e.lineno||0));var el=document.getElementById('boot-trace');if(el)el.style.color='#f66';},true);
window.addEventListener('unhandledrejection',function(e){var r=e.reason;mark('UNHANDLED-REJECTION: '+(r&&(r.message||String(r))||'?'));});
window.addEventListener('load',function(){mark('window.load: all classic resources finished');});
document.addEventListener('DOMContentLoaded',function(){mark('DOMContentLoaded');});
})();
</script><script type="module" src="/src/main.tsx"></script></body></html>
