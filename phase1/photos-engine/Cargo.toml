[package]
name = "somnia-photos-spike"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
[workspace]
resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
lightcraft-pipeline = { git = "https://github.com/storytold/lightcraft", rev = "ab9e8d372cc69de976b8ee822d260f088d781426" }
lightcraft-develop = { git = "https://github.com/storytold/lightcraft", rev = "ab9e8d372cc69de976b8ee822d260f088d781426" }
lightcraft-geom = { git = "https://github.com/storytold/lightcraft", rev = "ab9e8d372cc69de976b8ee822d260f088d781426" }
lightcraft-codecs = { git = "https://github.com/storytold/lightcraft", rev = "ab9e8d372cc69de976b8ee822d260f088d781426" }
lightcraft-raster = { git = "https://github.com/storytold/lightcraft", rev = "ab9e8d372cc69de976b8ee822d260f088d781426" }
serde_json = "1"
wasm-bindgen = "=0.2.129"
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
