[package]
name = "somnia-vibespace-sched"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Local Vibe Space schedule planner and fenced run manager"
[dependencies]
somnia-vibespace-storage = { path = "../vibespace-storage" }
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
thiserror = "2"
[dev-dependencies]
tempfile = "3"
[workspace]
