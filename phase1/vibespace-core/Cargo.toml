[package]
name = "somnia-vibespace-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"
license = "MIT"

[dependencies]
fs2 = "0.4"
tokio-util = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
vibespace-engine = { path = "../vibespace-engine" }
vibespace-policy = { path = "../vibespace-policy" }
somnia-vibespace-storage = { path = "../vibespace-storage" }
somnia-vibespace-checkpoints = { path = "../vibespace-checkpoints" }
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

[dev-dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
