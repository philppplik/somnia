[package]
name = "vibespace-acp"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
publish = false
description = "Agent Client Protocol (v1) stdio client for external agents; every permission goes through the vibespace consent broker"

# Standalone crate: not part of any other Cargo workspace.
[workspace]

[dependencies]
vibespace-policy = { path = "../vibespace-policy" }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
