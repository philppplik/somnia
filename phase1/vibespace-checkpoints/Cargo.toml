[package]
name = "somnia-vibespace-checkpoints"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "Content-addressed checkpoints, isolated copies, review and explicit apply for Vibe Space"

# Standalone crate: not part of any shared Cargo workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = 3
