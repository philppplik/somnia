[package]
name = "somnia-vibespace-skills"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
description = "Agent Skills (SKILL.md) parsing, validation, scanning and discovery for Vibe Space. Data only: nothing here executes a skill."

[dependencies]
somnia-vibespace-storage = { path = "../vibespace-storage" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

[dev-dependencies]
tempfile = "3"

[workspace]
