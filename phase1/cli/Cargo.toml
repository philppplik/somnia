[package]
name = "somnia-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Somnia headless CLI core: `somnia run`, JSON-IPC over a same-user local socket, attach."
license = "MIT"
publish = false

[[bin]]
name = "somnia"
path = "src/main.rs"

[lib]
name = "somnia_cli"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
fs2 = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# Contract truth for roundtrip tests: the real TUI protocol module (parse/encode/hash).
somnia-tui = { path = "../crates/somnia-tui" }

# Standalone crate: keeps the CLI buildable without the Tauri/desktop dependency tree.
[workspace]
