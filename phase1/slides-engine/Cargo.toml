[package]
name = "somnia-slides"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false
[workspace]
resolver = "3"
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.129"
serde_json = "1"
zip = { version = "3", default-features = false, features = ["deflate"] }
deckcraft-model = { git = "https://github.com/storytold/deckcraft", rev = "d0e57d7e25f9852179cc66be12dd6188f1c05535" }
deckcraft-pptx = { git = "https://github.com/storytold/deckcraft", rev = "d0e57d7e25f9852179cc66be12dd6188f1c05535" }
deckcraft-render = { git = "https://github.com/storytold/deckcraft", rev = "d0e57d7e25f9852179cc66be12dd6188f1c05535" }
[profile.release]
opt-level = "s"
lto = "thin"
