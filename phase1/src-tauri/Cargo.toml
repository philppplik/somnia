[package]
name = "somnia-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Product licensing must be set by the owner before distribution.

[lib]
name = "somnia_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "somnia-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-build", "dep:window-vibrancy", "dep:keyring"]

[dependencies]
somnia-relay = { path = "../../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
if-addrs = "0.13"
cap-std = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
fs2 = "0.4"
tauri = { version = "2", optional = true, features = ["macos-private-api"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

keyring = { version = "=3.6.3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = { version = "=0.8.1", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
