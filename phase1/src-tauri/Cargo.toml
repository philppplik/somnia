[package]
name = "somnia-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
# Product licensing must be set by the owner before distribution.

[lib]
name = "somnia_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "somnia-desktop"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-build"]

[dependencies]
cap-std = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
fs2 = "0.4"
tauri = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
