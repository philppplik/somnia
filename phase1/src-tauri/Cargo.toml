[package]
name = "somnia-desktop"
default-run = "somnia"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
# Product licensing must be set by the owner before distribution.

[lib]
name = "somnia_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "somnia"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
ext-selftest = ["desktop"]
folder-lock-interim = []
# Links the ONNX runtime for local multilingual-e5-small. Off: vector search reports "not available in this build".
vibespace-fastembed = ["somnia-vibespace-embed/fastembed"]
# Android/iOS shell: webview + dialog only. No desktop plugins, keyring, vibrancy or reqwest. Build with --no-default-features --features mobile.
mobile = ["dep:tauri", "dep:tauri-build"]
desktop = ["dep:tauri", "dep:tauri-plugin-dialog", "dep:tauri-plugin-updater", "dep:tauri-plugin-process", "dep:tauri-plugin-single-instance", "dep:tauri-build", "dep:window-vibrancy", "dep:keyring", "dep:reqwest", "dep:portable-pty"]

[dependencies]
url = "2"
somnia-vibespace-sched = { path = "../vibespace-sched" }
somnia-vibespace-core = { path = "../vibespace-core" }
somnia-vibespace-embed = { path = "../vibespace-embed" }
somnia-vibespace-skills = { path = "../vibespace-skills" }
vibespace-acp = { path = "../vibespace-acp" }
vibespace-policy = { path = "../vibespace-policy" }
somnia-relay = { path = "../../relay" }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros", "io-util"] }
if-addrs = "0.13"
cap-std = "3.4.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
notify = "8"
fs2 = "0.4"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
regex = "1"
libc = "0.2"
tauri = { version = "2", optional = true, features = ["macos-private-api"] }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-updater = { version = "2", optional = true }
tauri-plugin-process = { version = "2", optional = true }
tauri-plugin-single-instance = { version = "=2.5.0", optional = true }

reqwest = { version = "0.12", optional = true, default-features = false, features = ["rustls-tls", "stream", "json", "blocking"] }
keyring = { version = "=3.6.3", optional = true, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
jsonwebtoken = { version = "=9.3.1", default-features = false }
# No `transport-child-process`: MCP servers are only started through the broker (mcp_broker.rs), never spawned directly.
rmcp = { version = "=3.5.1", default-features = false, features = ["client", "transport-async-rw"] }

russh = { version = "=0.64.1", default-features = false, features = ["ring"] }
russh-sftp = { version = "=3.0.1", default-features = false }
rand = "0.10"
zeroize = "1"
ignore = "=0.4.25"
# FTPS (explicit TLS) client for shared-hosting deploy targets. ring only, same provider family as russh.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-native-certs = "0.8"
base64 = "0.22"
# Inline terminal PTY (MIT, wezterm project). ConPTY on Windows: no console window can flash.
portable-pty = { version = "=0.9.0", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
window-vibrancy = { version = "=0.8.1", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.59.0", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_Security", "Win32_System_ProcessStatus", "Win32_System_SystemInformation"] }

[build-dependencies]
tauri-build = { version = "2", optional = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
tempfile = "3"
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "client", "macros", "transport-async-rw"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
