name: Native folder switch bounded source import
on:
  push:
    branches: [fix/native-folder-switch]
    paths: [.github/workflows/folder-switch-source-import.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Import bounded authored sources
        run: |
          python3 - <<'PY'
          import base64,io,tarfile,pathlib
          data=base64.b64decode('')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
              members=tar.getmembers()
              for m in members:
                  p=pathlib.PurePosixPath(m.name)
                  if not m.isfile() or '..' in p.parts or p.is_absolute() or p.parts[0]!='phase1': raise ValueError('Unsafe import')
              tar.extractall('.',members=members,filter='data')
          PY
      - name: Build and test frontend
        working-directory: phase1
        run: |
          npm ci
          npm run build
          npm run test:core
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Commit validated sources only
        run: |
          test "${GITHUB_REF_NAME}" = "fix/native-folder-switch"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase1/
          git rm .github/workflows/folder-switch-source-import.yml
          git commit -m 'fix: preserve native project when folder selection cancels or fails'
          git push origin HEAD:fix/native-folder-switch
