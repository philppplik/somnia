name: Phase 1 validation
on:
  push:
    branches: [phase1-foundation]
    paths: [phase1/**, docs/release-tools/**, .github/workflows/phase1-core-bootstrap.yml]
  pull_request:
    paths: [phase1/**, docs/release-tools/**, .github/workflows/phase1-core-bootstrap.yml]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: Regenerate studio-shell screenshot baselines and commit them to this ref
        type: boolean
        default: false
      full-matrix:
        description: Run the full 3-platform matrix including macOS (tags always run it, except alpha tags)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  release-plan:
    # Standard hosted runners are free only while this repository is public.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    outputs:
      arm: ${{ steps.plan.outputs.arm }}
      cli-matrix: ${{ steps.plan.outputs.cli-matrix }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Select release-only ARM builds (beta.4 onwards)
        id: plan
        env:
          FULL: ${{ (github.ref_type == 'tag' && !contains(github.ref_name, 'alpha')) || inputs.full-matrix }}
        run: |
          if [ "$FULL" = "true" ]; then
            node phase1/scripts/release-platforms.mjs --full >> "$GITHUB_OUTPUT"
          else
            node phase1/scripts/release-platforms.mjs >> "$GITHUB_OUTPUT"
          fi
  frontend:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - name: Sound Studio core tests (native, real MP3 fixture)
        run: cargo +1.95.0 test --locked --manifest-path sound/Cargo.toml
      - name: Layer rules (new violations only)
        run: npm run check:layers
      - name: Dreamweaver parity checklist is current
        run: npm run check:dreamweaver-parity
      - name: Headless CLI and TUI crate tests (native)
        run: |
          cargo +1.95.0 test --locked --manifest-path cli/Cargo.toml
          cargo +1.95.0 test --locked --manifest-path crates/somnia-tui/Cargo.toml
      - run: npm run build && npm run test:core
      - name: Release bundle has no web-control hook
        run: npm run check:no-control
      - name: Test performance-budget validation
        run: node --test scripts/performance/report.test.mjs
      - name: Release policy and asset assembly tests
        run: node --test --experimental-strip-types test/cli-release/*.test.ts
      - name: Editor-core budgets (full parser)
        run: npm run bench
      - name: Editor-core budgets (incremental parser)
        if: ${{ !cancelled() }}
        env:
          SOMNIA_INCREMENTAL: '1'
        run: npm run bench
      - name: Retain performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-performance-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/validation/bench/*.json
            phase1/validation/bench/*.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Render corpus guards
        if: ${{ !cancelled() }}
        run: npm run test:render-corpus
      - name: Render goldens (blocking, runner-baselined with approval receipt 2026-10-12)
        if: ${{ !cancelled() }}
        id: render_goldens
        run: npm run test:render-goldens
      - name: Render determinism probe (two separate runs, identical hashes)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: npm run test:render-determinism
      - name: Retain render golden diffs
        if: ${{ always() && steps.render_goldens.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: somnia-render-golden-diffs-${{ github.sha }}
          retention-days: 7
          if-no-files-found: ignore
          path: phase1/test-results/render
  snapshots:
    if: ${{ github.event.repository.visibility == 'public' && inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: npx playwright install --with-deps chromium
      - name: Regenerate shell baselines
        run: npx playwright test tests/studio-shell-snapshot.spec.ts --update-snapshots
      - name: Commit updated baselines
        run: |
          git config user.name "Philipp Paulik"
          git config user.email "philipp.paulik@users.noreply.github.com"
          git add tests/studio-shell-snapshot.spec.ts-snapshots
          if git diff --cached --quiet; then echo "no snapshot changes"; else
            git commit -m "test(e2e): regenerate studio shell baselines in CI [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
  native:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Vibespace pure crate suites (locked)
        run: |
          cargo test --locked --manifest-path vibespace-core/Cargo.toml
          cargo test --locked --manifest-path vibespace-storage/Cargo.toml
          cargo test --locked --manifest-path vibespace-checkpoints/Cargo.toml
          cargo test --locked --manifest-path vibespace-engine/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml --features cap-layer
          cargo test --locked --manifest-path vibespace-acp/Cargo.toml
      - name: Vibespace desktop command module tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop vibespace_commands
      - name: Lifecycle command module tests (desktop feature)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop lifecycle_commands
      - name: MCP desktop tests (gateway and studio wiring, desktop feature)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop mcp_
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build private unsigned alpha bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.alpha.conf.json --bundles deb,appimage
      - name: Native Xvfb keyboard smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/native-smoke.sh
      - name: Retain private alpha and GUI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-linux-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/release/bundle/deb/*.deb
            phase1/src-tauri/target/release/bundle/appimage/*.AppImage
            phase1/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            phase1/validation/native/
  windows:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: CLI tests (named-pipe transport, locked)
        run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Vibespace pure crate suites (locked)
        run: |
          cargo test --locked --manifest-path vibespace-core/Cargo.toml
          cargo test --locked --manifest-path vibespace-storage/Cargo.toml
          cargo test --locked --manifest-path vibespace-checkpoints/Cargo.toml
          cargo test --locked --manifest-path vibespace-engine/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml --features cap-layer
          cargo test --locked --manifest-path vibespace-acp/Cargo.toml
      - name: Vibespace desktop command module tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop vibespace_commands
      - name: Lifecycle command module tests (desktop feature)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop lifecycle_commands
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build private unsigned Windows alpha
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.windows-alpha.conf.json --bundles nsis,msi
      - name: Build unsigned MSIX for the Microsoft Store (experimental, does not fail CI yet)
        id: msix
        continue-on-error: true
        shell: pwsh
        run: ./scripts/make-msix.ps1
      - name: Retain MSIX
        if: steps.msix.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: somnia-msix-${{ github.sha }}
          retention-days: 14
          path: phase1/out/*.msix
      - name: Retain private Windows alpha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-windows-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/release/bundle/nsis/*.exe
            phase1/src-tauri/target/release/bundle/nsis/*.exe.sig
            phase1/src-tauri/target/release/bundle/msi/*.msi
  windows-arm:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.arm == 'true' }}
    runs-on: windows-11-arm
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - name: Reject emulated build toolchains
        shell: bash
        run: |
          node -e "if(process.arch !== 'arm64') throw Error('Node is not native ARM64')"
          rustc -vV | grep -q 'host: aarch64-pc-windows-msvc'
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: CLI tests (named-pipe transport, locked)
        run: cargo test --locked --manifest-path cli/Cargo.toml
      - name: Vibespace pure crate suites (locked)
        run: |
          cargo test --locked --manifest-path vibespace-core/Cargo.toml
          cargo test --locked --manifest-path vibespace-storage/Cargo.toml
          cargo test --locked --manifest-path vibespace-checkpoints/Cargo.toml
          cargo test --locked --manifest-path vibespace-engine/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml --features cap-layer
          cargo test --locked --manifest-path vibespace-acp/Cargo.toml
      - name: Vibespace desktop command module tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop vibespace_commands
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build native ARM64 Windows installers
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.windows-alpha.conf.json --target aarch64-pc-windows-msvc --bundles nsis,msi
      - name: Verify the app is native ARM64 (NSIS bootstrapper is x86)
        run: node scripts/verify-native-arch.mjs windows src-tauri/target/aarch64-pc-windows-msvc/release/somnia.exe
      - uses: actions/upload-artifact@v7
        with:
          name: somnia-windows-arm64-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe
            phase1/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            phase1/src-tauri/target/aarch64-pc-windows-msvc/release/bundle/msi/*.msi
  linux-arm:
    needs: release-plan
    if: ${{ needs.release-plan.outputs.arm == 'true' }}
    runs-on: ubuntu-24.04-arm
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: arm64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick
      - name: Reject emulated build toolchains
        shell: bash
        run: |
          node -e "if(process.arch !== 'arm64') throw Error('Node is not native ARM64')"
          rustc -vV | grep -q 'host: aarch64-unknown-linux-gnu'
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Vibespace pure crate suites (locked)
        run: |
          cargo test --locked --manifest-path vibespace-core/Cargo.toml
          cargo test --locked --manifest-path vibespace-storage/Cargo.toml
          cargo test --locked --manifest-path vibespace-checkpoints/Cargo.toml
          cargo test --locked --manifest-path vibespace-engine/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml
          cargo test --locked --manifest-path vibespace-policy/Cargo.toml --features cap-layer
          cargo test --locked --manifest-path vibespace-acp/Cargo.toml
      - name: Vibespace desktop command module tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --features desktop vibespace_commands
      - name: MCP desktop tests (gateway and studio wiring, desktop feature)
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --features desktop mcp_
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs
      - name: Build native ARM64 Linux deb (AppImage not advertised)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.alpha.conf.json --target aarch64-unknown-linux-gnu --bundles deb
      - name: Verify the app is native ARM64
        run: node scripts/verify-native-arch.mjs linux src-tauri/target/aarch64-unknown-linux-gnu/release/somnia
      - uses: actions/upload-artifact@v7
        with:
          name: somnia-linux-arm64-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: phase1/src-tauri/target/aarch64-unknown-linux-gnu/release/bundle/deb/*.deb
  macos:
    # Philipp's matrix policy (2026-10-11): dev/alpha runs Windows + Linux only;
    # beta and stable tags run the full 3-platform matrix. Force via full-matrix input.
    if: ${{ github.event.repository.visibility == 'public' && ((github.ref_type == 'tag' && !contains(github.ref_name, 'alpha')) || inputs.full-matrix) }}
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install isolated PhotoCraft WASM toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          rustup target add wasm32-unknown-unknown --toolchain 1.95.0
          cargo +1.95.0 install wasm-bindgen-cli --version 0.2.129 --locked
      - run: npm ci
      - name: Build headless PhotoCraft assets before frontend/Tauri
        run: npm run craft:build
      - name: Build headless WordCraft document engine (Documents Studio)
        run: npm run documents:build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Updater harness tests (no secrets, no network)
        run: npm run test:updater
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build ad-hoc signed, not notarized macOS beta
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.macos-alpha.conf.json --bundles ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'dmg,app' || 'dmg' }}
      - name: Verify macOS image and sealed app signatures
        run: bash scripts/macos/verify-bundle.sh
      - name: Diagnose the previous stable DMG
        continue-on-error: true
        run: bash scripts/macos/inspect-previous-dmg.sh
      - name: Retain macOS alpha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-macos-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/release/bundle/dmg/*.dmg
            phase1/src-tauri/target/release/bundle/macos/*.app.tar.gz
            phase1/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            phase1/src-tauri/target/release/bundle/macos-*.txt
  # Native CLI: x64 on every run; ARM64 only on eligible full release runs.
  cli:
    needs: release-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.release-plan.outputs.cli-matrix) }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Packaging and release-policy tests
        run: node --test --experimental-strip-types test/cli-release/*.test.ts
      - name: Build the agent engine sidecar and test it
        run: |
          npm run build:cli-engine
          npm run test:cli-engine
      - name: CLI tests (real-sidecar tests run now that the engine is built)
        run: cargo test --manifest-path cli/Cargo.toml --locked
      - name: Build and archive the CLI
        run: node scripts/package-cli.mjs build --out cli-dist
      - name: Verify ARM64 CLI machine header
        if: ${{ matrix.arch == 'arm64' }}
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            node scripts/verify-native-arch.mjs windows cli/target/release/somnia.exe
          else
            node scripts/verify-native-arch.mjs linux cli/target/release/somnia
          fi
      - name: Smoke test the packaged binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cli-smoke && cd cli-smoke
          if [ "$RUNNER_OS" = "Windows" ]; then /c/Windows/System32/tar.exe -xf ../cli-dist/somnia-cli-*.zip; bin=$(ls -d somnia-cli-*)/somnia.exe; else tar -xzf ../cli-dist/somnia-cli-*.tar.gz; bin=$(ls -d somnia-cli-*)/somnia; fi
          test -f "$(dirname "$bin")/sidecar/engine.mjs"
          "$bin" --version | tee version.txt
          grep -q "^somnia $(node -p "require('../package.json').somniaRelease")" version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: somnia-cli-${{ runner.os }}-${{ matrix.arch }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/cli-dist/somnia-cli-*.tar.gz
            phase1/cli-dist/somnia-cli-*.zip
            phase1/cli-dist/*.sha256
  cli-checksums:
    if: ${{ github.event.repository.visibility == 'public' }}
    needs: cli
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          pattern: somnia-cli-*-${{ github.sha }}
          merge-multiple: true
          path: cli-dist
      - run: node phase1/scripts/package-cli.mjs sums cli-dist
      - run: cd cli-dist && sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: somnia-cli-SHA256SUMS-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: cli-dist/SHA256SUMS
