name: Phase 1 core foundation
on:
  push:
    branches: [phase1-foundation]
    paths: [.github/workflows/phase1-core-bootstrap.yml, phase1/**]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import verified core sources once
        run: |
          python3 - <<'PY'
          import base64,io,tarfile,pathlib
          if not pathlib.Path('phase1/packages/editor-core/src/index.ts').exists():
              data=base64.b64decode('')
              with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tar:
                  members=tar.getmembers()
                  for m in members:
                      p=pathlib.PurePosixPath(m.name)
                      if not m.isfile() or '..' in p.parts or p.is_absolute() or p.parts[0]!='phase1':
                          raise ValueError('Unsafe import path')
                  tar.extractall('.',members=members,filter='data')
          PY
      - name: Test source-preserving core
        working-directory: phase1
        run: npm ci && npm run typecheck && npm test
      - name: Commit tested sources to development branch only
        run: |
          test "${GITHUB_REF_NAME}" = "phase1-foundation"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phase1/
          if ! git diff --cached --quiet; then
            git commit -m 'feat: add tested phase 1 source-preserving editor core'
            git push origin HEAD:phase1-foundation
          fi
