name: Phase 1 validation
on:
  push:
    branches: [phase1-foundation]
    paths: [phase1/**, .github/workflows/phase1-core-bootstrap.yml]
  pull_request:
    paths: [phase1/**, .github/workflows/phase1-core-bootstrap.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build && npm run test:core
      - name: Test performance-budget validation
        run: node --test scripts/performance/report.test.mjs
      - name: Editor-core budgets (full parser)
        run: npm run bench
      - name: Editor-core budgets (incremental parser)
        if: ${{ !cancelled() }}
        env:
          SOMNIA_INCREMENTAL: '1'
        run: npm run bench
      - name: Retain performance reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-performance-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/validation/bench/*.json
            phase1/validation/bench/*.md
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  native:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb xdotool imagemagick
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - run: cargo check --manifest-path src-tauri/Cargo.toml --locked
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build private unsigned alpha bundles
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.alpha.conf.json --bundles deb,appimage
      - name: Native Xvfb keyboard smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" bash scripts/native-smoke.sh
      - name: Retain private alpha and GUI evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-linux-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/release/bundle/deb/*.deb
            phase1/src-tauri/target/release/bundle/appimage/*.AppImage
            phase1/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            phase1/validation/native/
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Sync app version (and enable signed updater artifacts when the signing key secret exists)
        run: node scripts/sync-version.mjs ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--updater' || '' }}
      - name: Build private unsigned Windows alpha
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build -- --ci --config src-tauri/tauri.windows-alpha.conf.json --bundles nsis,msi
      - name: Build unsigned MSIX for the Microsoft Store (experimental, does not fail CI yet)
        id: msix
        continue-on-error: true
        shell: pwsh
        run: ./scripts/make-msix.ps1
      - name: Retain MSIX
        if: steps.msix.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: somnia-msix-${{ github.sha }}
          retention-days: 14
          path: phase1/out/*.msix
      - name: Retain private Windows alpha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-windows-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: |
            phase1/src-tauri/target/release/bundle/nsis/*.exe
            phase1/src-tauri/target/release/bundle/nsis/*.exe.sig
            phase1/src-tauri/target/release/bundle/msi/*.msi
  macos:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml --no-default-features --locked
      - name: Build unsigned, not notarized macOS alpha
        run: npm run tauri build -- --ci --config src-tauri/tauri.macos-alpha.conf.json --bundles dmg
      - name: Retain macOS alpha
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: somnia-macos-alpha-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: phase1/src-tauri/target/release/bundle/dmg/*.dmg
