name: Extension dev docs v2
on:
  push:
    branches: ['ext/dev-docs', 'somnia-agent']
    paths:
      - 'docs/extensions/v2/**'
      - 'scripts/generate-extension-manifest-reference.mjs'
      - 'phase1/scripts/somnia-ext-v2.ts'
      - 'phase1/src/lib/extensions/**'
      - 'phase1/package*.json'
      - '.github/workflows/extensions-dev-docs.yml'
  pull_request:
    paths:
      - 'docs/extensions/v2/**'
      - 'scripts/generate-extension-manifest-reference.mjs'
      - 'phase1/scripts/somnia-ext-v2.ts'
      - 'phase1/src/lib/extensions/**'
      - 'phase1/package*.json'
      - '.github/workflows/extensions-dev-docs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev-docs:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: phase1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: phase1/package-lock.json
      - run: npm ci
      - name: Check extension contract types without generated studio engines
        run: npx tsc -p tsconfig.extensions-v2.json
      - name: Generated manifest reference matches the schema
        run: node ../scripts/generate-extension-manifest-reference.mjs --check
      - name: Test docs, examples and code coverage gates
        run: npx tsx --test src/lib/extensions/devDocsV2.test.ts
      - name: Manifest and package regressions stay green
        run: npx tsx --test src/lib/extensions/manifestV2.test.ts src/lib/extensions/packageV2.test.ts
      - name: Quickstart replay - validate and pack every example verbatim
        run: |
          for example in hello-panel fs-consent network-host-scope; do
            npx tsx scripts/somnia-ext-v2.ts validate "../docs/extensions/v2/examples/$example"
            npx tsx scripts/somnia-ext-v2.ts pack "../docs/extensions/v2/examples/$example"
          done
          rm -f ../docs/extensions/v2/examples/*.somniax
