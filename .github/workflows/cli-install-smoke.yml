name: cli-install-smoke
# Manual only: runs the CLI installers against a real GitHub Release and checks they are idempotent.
on:
  push:
    branches: [feat/cli-install]
    paths: ['phase1/cli/install/**', '.github/workflows/cli-install-smoke.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag with CLI archives
        required: true
        default: v12.2.0-beta.2
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: |
          sh phase1/cli/install/install.sh --version "${{ inputs.tag || 'v12.2.0-beta.2' }}"
          sh phase1/cli/install/install.sh --version "${{ inputs.tag || 'v12.2.0-beta.2' }}"
          "$HOME/.local/bin/somnia" --version
          test "$(grep -c "somnia-cli path" "$HOME/.profile" 2>/dev/null || true)" -le 1
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - shell: cmd
        run: |
          call phase1\cli\install\install.bat -Version ${{ inputs.tag || 'v12.2.0-beta.2' }}
          if errorlevel 1 exit /b 1
          call phase1\cli\install\install.bat -Version ${{ inputs.tag || 'v12.2.0-beta.2' }}
          if errorlevel 1 exit /b 1
          "%LOCALAPPDATA%\Programs\somnia-cli\somnia.exe" --version
